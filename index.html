<style>

*{box-sizing:border-box}body{margin:0;background:#f7f4fb;color:var(--ink);font:16px/1.58 Arial,sans-serif}header{background:linear-gradient(135deg,#35205e,#6336a5 55%,#8b5fc7);color:#fff;text-align:center;padding:34px 16px 28px;border-bottom:6px solid #f0c66e;position:relative;overflow:hidden}header:before,header:after{content:'✦  ✧  ✦';position:absolute;color:#f5d98a;font-size:1.45rem;letter-spacing:12px;opacity:.9}header:before{left:18px;top:15px}header:after{right:18px;bottom:13px}header h1{font-size:clamp(1.45rem,4vw,2.1rem);line-height:1.2;margin:9px auto;max-width:850px}.eyebrow{font-size:.82rem;font-weight:bold;letter-spacing:1.6px;text-transform:uppercase}header p{margin:8px 0 0;color:#f7efff} .ornament{height:2px;width:min(270px,70%);margin:17px auto 0;background:#f0c66e;position:relative}.ornament:before{content:'❖';position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);background:#6336a5;padding:0 12px;color:#f0c66e}main{max-width:870px;margin:22px auto;padding:0 14px 36px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:21px;box-shadow:0 7px 22px #14243a0a;margin-bottom:16px}.topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--navy);font-weight:bold}.track{height:9px;background:#e4eee9;border-radius:30px;overflow:hidden;margin:13px 0 7px}.bar{height:100%;background:var(--green);width:0}.qnum{font-size:.9rem;color:var(--green);font-weight:bold;letter-spacing:.5px}h2{font-size:1.22rem;line-height:1.45;color:var(--navy);margin:10px 0 18px}.answers{display:grid;gap:10px}.answer{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border:1.5px solid #d5e2de;border-radius:12px;background:#fff;color:var(--ink);font-size:1rem;line-height:1.45;cursor:pointer}.answer:hover:not(:disabled){background:#f0faf5;border-color:var(--green)}.letter{display:inline-grid;place-items:center;flex:0 0 29px;height:29px;border-radius:50%;background:#eaf2ee;color:var(--navy);font-weight:bold}.answer.correct{border-color:var(--good);background:#eaf8ef;color:#164b30}.answer.correct .letter{background:var(--good);color:#fff}.answer.wrong{border-color:var(--bad);background:#fff0ef;color:#78231c}.answer.wrong .letter{background:var(--bad);color:#fff}.answer:disabled{opacity:1;cursor:default}.feedback{display:none;padding:14px 15px;border-radius:11px;margin-top:15px}.feedback.show{display:block}.feedback.good{background:#eaf8ef;border-left:4px solid var(--good);color:#174b30}.feedback.bad{background:#fff0ef;border-left:4px solid var(--bad);color:#78231c}.controls{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}button.primary,button.secondary{border:0;border-radius:10px;padding:12px 18px;font-size:1rem;font-weight:bold;cursor:pointer}button.primary{background:var(--green);color:#fff}button.primary:hover{background:#086b50}button.secondary{background:#e9f0f4;color:var(--navy)}button:disabled{opacity:.45;cursor:not-allowed}.small{font-size:.9rem;color:#627387}.result{text-align:center}.score{font-size:3.2rem;color:var(--green);font-weight:800;margin:12px}.review-item{text-align:left;border-top:1px solid var(--line);padding:14px 0}.right{color:var(--good)}.yourwrong{color:var(--bad)}footer{text-align:center;color:#627387;font-size:.83rem;padding:18px}@media(max-width:520px){.panel{padding:16px}.controls button{flex:1}}

<header><div class="eyebrow">Kelas M * Pascasarjana PJJ PAI UIN SSC Cirebon 2026</div><h1>Filsafat Pendidikan Islam</h1><p>Konsep Dasar, Ruang Lingkup, Aliran Utama, dan Problematika Pendidikan Kontemporer</p><div class="ornament"></div></header>
<main><section class="panel" id="quizPanel"><div class="topline"><span id="progressText"></span><span id="scoreText"></span></div><div class="track"><div class="bar" id="progressBar"></div></div><div class="qnum" id="qnum"></div><h2 id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="secondary" id="restartBtn">Acak Ulang</button><button class="primary" id="nextBtn" disabled>Soal Berikutnya →</button></div><p class="small">Pilih satu jawaban. Kunci dan penjelasan muncul setelah pilihan diklik.</p></section>
<section class="panel result" id="resultPanel" hidden><div class="qnum">HASIL KUIS</div><h2>Kuis selesai!</h2><div class="score" id="finalScore"></div><p id="resultMessage"></p><button class="primary" id="reviewBtn">Lihat Pembahasan</button> <button class="secondary" id="againBtn">Ulangi dengan Soal Acak</button><div id="review" hidden></div></section></main><footer>Filsafat Pendidikan Islam • Kelas M</footer>
<script>
const original=[
["Apa fokus utama filsafat pendidikan Islam?",["Teknik administrasi sekolah semata","Landasan, tujuan, nilai, dan hakikat pendidikan dalam perspektif Islam","Penyusunan jadwal pelajaran saja","Pengukuran ujian tanpa membahas tujuan pendidikan"],1,"Filsafat pendidikan Islam mengkaji dasar, tujuan, nilai, hakikat manusia, ilmu, dan proses pendidikan dalam pandangan Islam."],
["Pertanyaan tentang hakikat manusia sebagai subjek pendidikan terutama termasuk ranah ...",["Ontologi","Epistemologi","Aksiologi","Administrasi"],0,"Ontologi membahas hakikat keberadaan dan realitas, termasuk pandangan tentang manusia."],
["Pertanyaan tentang sumber dan cara memperoleh pengetahuan yang dapat dipertanggungjawabkan termasuk ranah ...",["Aksiologi","Epistemologi","Ontologi","Manajemen"],1,"Epistemologi membahas sumber, metode, validitas, dan batas pengetahuan."],
["Kajian tentang nilai moral dan tujuan penggunaan ilmu dalam pendidikan berkaitan dengan ...",["Ontologi","Epistemologi","Aksiologi","Kronologi"],2,"Aksiologi mengkaji nilai, tujuan, dan kegunaan ilmu, termasuk dimensi etis pendidikan."],
["Dalam perspektif pendidikan Islam, tujuan pendidikan yang komprehensif paling tepat diarahkan pada ...",["Penguasaan materi untuk ujian saja","Pembentukan manusia berilmu, berakhlak, dan bertanggung jawab kepada Allah serta sesama","Pencapaian status sosial tanpa pertimbangan moral","Keterampilan kerja dengan mengabaikan pembentukan karakter"],1,"Tujuan pendidikan Islam mencakup dimensi intelektual, spiritual, moral, dan sosial secara terpadu."],
["Apa ciri pendekatan perenialisme dalam filsafat pendidikan secara umum?",["Menekankan nilai dan gagasan yang dianggap abadi serta karya-karya besar","Mengutamakan perubahan kurikulum setiap minggu","Menolak semua tradisi intelektual","Menganggap pengalaman praktis sebagai satu-satunya sumber pengetahuan"],0,"Perenialisme menekankan kebenaran atau nilai yang dianggap tahan lama dan dialog dengan gagasan besar."],
["Pendekatan esensialisme dalam pendidikan terutama menekankan ...",["Penghapusan pengetahuan dasar dari kurikulum","Penguasaan pengetahuan dan keterampilan inti yang dinilai penting diwariskan","Kebebasan tanpa tujuan pembelajaran","Penolakan peran guru dalam proses belajar"],1,"Esensialisme menekankan penguasaan pengetahuan dan keterampilan dasar yang dianggap penting."],
["Aliran progresivisme cenderung memandang pembelajaran yang baik sebagai proses yang ...",["Berpusat pada pengalaman, pemecahan masalah, dan keaktifan peserta didik","Hanya menuntut hafalan tanpa pemahaman","Tidak boleh menyesuaikan diri dengan kebutuhan peserta didik","Menolak pengalaman sebagai sumber belajar"],0,"Progresivisme menekankan pengalaman, partisipasi aktif, pemecahan masalah, dan relevansi pembelajaran."],
["Dalam pendidikan, rekonstruksionisme sosial menekankan bahwa sekolah sebaiknya ...",["Menghindari semua persoalan masyarakat","Membantu peserta didik memahami dan memperbaiki persoalan sosial secara kritis dan bertanggung jawab","Hanya melatih kepatuhan tanpa refleksi","Memisahkan pembelajaran dari kehidupan bersama"],1,"Rekonstruksionisme memandang pendidikan sebagai sarana refleksi dan pembaruan sosial."],
["Bagaimana filsafat pendidikan Islam sebaiknya berhubungan dengan aliran filsafat pendidikan umum?",["Menyalin semua gagasan tanpa penilaian","Mengkaji gagasan secara kritis berdasarkan nilai, tujuan, dan sumber pengetahuan Islam","Menolak seluruh konsep dari luar tanpa kajian","Menganggap semua aliran identik"],1,"Dialog kritis memungkinkan gagasan dikaji manfaat, asumsi, dan kesesuaiannya dengan landasan pendidikan Islam."],
["Apa yang dimaksud integrasi ilmu dalam konteks pendidikan Islam?",["Memisahkan ilmu agama dari seluruh ilmu lain","Menghubungkan berbagai bidang pengetahuan secara bermakna tanpa mengabaikan metode dan karakter masing-masing","Menganggap semua bidang ilmu memiliki metode persis sama","Menghapus kajian ilmu alam dan sosial"],1,"Integrasi ilmu menghubungkan pengetahuan dan nilai secara bermakna sambil memperhatikan kekhasan tiap disiplin."],
["Sekolah menghadapi perundungan digital antarpeserta didik. Respons yang paling sejalan dengan filsafat pendidikan Islam adalah ...",["Menganggapnya urusan pribadi yang tidak terkait pendidikan","Menggabungkan perlindungan korban, pembinaan akhlak, literasi digital, dan tanggung jawab komunitas sekolah","Melarang seluruh diskusi tentang teknologi","Hanya memberi hukuman tanpa edukasi atau pemulihan"],1,"Respons menyeluruh menggabungkan perlindungan, pembentukan akhlak, literasi, dan tanggung jawab sosial."],
["Ketika kecerdasan buatan digunakan dalam tugas peserta didik, pertanyaan filosofis yang penting adalah ...",["Bagaimana memastikan semua peserta didik memakai aplikasi sama?","Bagaimana menjaga kejujuran akademik, tanggung jawab, kemampuan berpikir, dan tujuan pembelajaran?","Bagaimana mengganti semua guru secepat mungkin?","Bagaimana menghindari penilaian proses belajar?"],1,"Filsafat pendidikan membantu menilai teknologi berdasarkan tujuan, nilai, tanggung jawab, dan dampaknya terhadap pembelajaran."],
["Apa risiko pendidikan yang hanya berorientasi pada nilai ujian dan peringkat?",["Selalu meningkatkan semua aspek karakter","Dapat mengabaikan akhlak, pemahaman mendalam, kreativitas, dan kesejahteraan peserta didik","Membuat penilaian akademik tidak diperlukan sama sekali","Menjamin semua peserta didik memahami materi secara mendalam"],1,"Orientasi yang terlalu sempit pada skor berisiko mengabaikan tujuan pendidikan yang lebih utuh."],
["Dalam menghadapi keberagaman latar belakang peserta didik, prinsip yang relevan adalah ...",["Memberikan perlakuan identik tanpa melihat kebutuhan atau hambatan","Menjaga martabat dan keadilan serta menyesuaikan dukungan agar kesempatan belajar bermakna","Mengeluarkan peserta didik yang berbeda kemampuan","Menganggap keberagaman selalu menjadi penghalang"],1,"Keadilan pendidikan mempertimbangkan martabat, kebutuhan, dan hambatan agar peserta didik memperoleh kesempatan belajar yang layak."],
["Apa peran guru menurut pandangan pendidikan yang menekankan pembentukan akhlak?",["Sebatas menyampaikan informasi tanpa memberi contoh","Menjadi pembimbing ilmu sekaligus teladan perilaku yang dapat dipertanggungjawabkan","Menghindari hubungan edukatif dengan peserta didik","Menggantikan seluruh peran keluarga dan masyarakat"],1,"Guru membimbing pengetahuan dan karakter; keteladanan mendukung konsistensi antara ajaran dan perilaku."],
["Manakah contoh penerapan pemikiran progresivisme yang dapat dievaluasi dari perspektif pendidikan Islam?",["Peserta didik menyelidiki masalah kebersihan sekolah, bekerja sama, lalu merefleksikannya dengan nilai amanah dan tanggung jawab","Peserta didik dibiarkan memilih kegiatan tanpa tujuan atau bimbingan","Guru melarang pertanyaan dan pengalaman langsung","Semua pengetahuan diganti dengan opini pribadi"],0,"Pengalaman dan pemecahan masalah dapat dipadukan dengan refleksi nilai Islam serta tujuan pembelajaran yang jelas."],
["Mengapa filsafat pendidikan penting dalam merespons komersialisasi pendidikan?",["Agar pendidikan dipandang semata-mata sebagai barang dagangan","Untuk menguji tujuan, keadilan akses, martabat manusia, dan tanggung jawab sosial dalam kebijakan pendidikan","Agar aspek biaya tidak boleh dibahas","Untuk menolak semua bentuk pengelolaan lembaga"],1,"Analisis filosofis mempertanyakan nilai di balik kebijakan, termasuk keseimbangan efisiensi, keadilan, dan kepentingan peserta didik."],
["Bagaimana filsafat pendidikan Islam dapat membantu menghadapi krisis keteladanan di lingkungan pendidikan?",["Mengutamakan slogan tanpa perubahan praktik","Menilai konsistensi antara nilai yang diajarkan, perilaku pendidik, budaya lembaga, dan kebijakan","Menghapus pendidikan karakter","Menyerahkan akhlak hanya kepada mata pelajaran tertentu"],1,"Keteladanan berkaitan dengan konsistensi nilai pada perilaku individu dan budaya lembaga, bukan hanya slogan."],
["Apa indikator kebijakan pendidikan yang mempertimbangkan filsafat pendidikan secara memadai?",["Mengikuti tren tanpa alasan jelas","Memiliki tujuan eksplisit, landasan nilai, pertimbangan bukti, keadilan, dan evaluasi dampak","Hanya mengutamakan citra lembaga","Tidak perlu ditinjau setelah diterapkan"],1,"Kebijakan reflektif menghubungkan tujuan dan nilai dengan bukti, keadilan, penilaian dampak, serta perbaikan."]
];
let qs=[],idx=0,score=0,chosen=[],answers=[];const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){qs=shuffle(original.map(x=>({q:x[0],a:shuffle(x[1].map((t,i)=>({text:t,ok:i===x[2]}))),e:x[3]})));idx=0;score=0;chosen=[];answers=[];$("quizPanel").hidden=false;$("resultPanel").hidden=true;render()}
function render(){let q=qs[idx];$("progressText").textContent=`Soal ${idx+1} dari 20`;$("scoreText").textContent=`Benar: ${score}`;$("progressBar").style.width=`${idx/20*100}%`;$("qnum").textContent=`PERTANYAAN ${String(idx+1).padStart(2,"0")}`;$("question").textContent=q.q;$("answers").innerHTML="";$("feedback").className="feedback";$("feedback").textContent="";$("nextBtn").disabled=true;$("nextBtn").textContent=idx===19?"Lihat Nilai Akhir →":"Soal Berikutnya →";q.a.forEach((o,i)=>{let b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${"ABCD"[i]}</span><span>${o.text}</span>`;b.onclick=()=>pick(i);$("answers").appendChild(b)})}
function pick(i){if(chosen[idx]!==undefined)return;chosen[idx]=i;let q=qs[idx],opts=[...$("answers").children],correct=q.a.findIndex(o=>o.ok),ok=i===correct;if(ok)score++;answers[idx]={chosen:i,correct};opts.forEach((b,j)=>{b.disabled=true;if(j===correct)b.classList.add("correct");if(j===i&&!ok)b.classList.add("wrong")});let f=$("feedback");f.className="feedback show "+(ok?"good":"bad");f.innerHTML=`<strong>${ok?"Benar!":"Belum tepat."}</strong> ${ok?"":"Jawaban yang benar: "+q.a[correct].text+". "}${q.e}`;$("scoreText").textContent=`Benar: ${score}`;$("progressBar").style.width=`${(idx+1)/20*100}%`;$("nextBtn").disabled=false}
function finish(){$("quizPanel").hidden=true;$("resultPanel").hidden=false;let p=Math.round(score/20*100);$("finalScore").textContent=`${p}/100`;$("resultMessage").textContent=`Jawaban benar: ${score} dari 20. ${p>=85?"Sangat baik!":p>=70?"Baik, terus tingkatkan pemahaman.":p>=55?"Cukup; pelajari kembali pembahasannya.":"Mari pelajari kembali konsep dan pembahasannya."}`;$("review").hidden=true;$("review").innerHTML=""}
$("nextBtn").onclick=()=>{if(chosen[idx]===undefined)return;if(idx<19){idx++;render()}else finish()};$("restartBtn").onclick=start;$("againBtn").onclick=start;
$("reviewBtn").onclick=()=>{let r=$("review");if(!r.hidden){r.hidden=true;$("reviewBtn").textContent="Lihat Pembahasan";return}r.hidden=false;$("reviewBtn").textContent="Tutup Pembahasan";r.innerHTML=qs.map((q,i)=>{let c=q.a.findIndex(o=>o.ok),u=answers[i];return `<div class="review-item"><strong>${i+1}. ${q.q}</strong><p class="${u&&u.chosen===c?"right":"yourwrong"}">Jawaban Anda: ${u?q.a[u.chosen].text:"Belum dijawab"}</p><p class="right">Kunci: ${q.a[c].text}</p><p>${q.e}</p></div>`}).join("")};start();
</script></body></html>
